<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SmartCalc Hindi - आसान और मुफ्त online calculators">
<title>SmartCalc Hindi - Free Online Calculators</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;padding:18px 16px;text-align:center;box-shadow:0 2px 10px #00000012}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0;color:#667085}
main{max-width:900px;margin:25px auto;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px #00000010}
.card h2{margin-top:0;font-size:20px}
input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;margin:7px 0 12px;font-size:16px}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:12px;padding:12px;background:#f0f5ff;border-radius:9px;min-height:20px}
footer{text-align:center;padding:30px;color:#667085}
</style>
</head>
<body>
<header>
<h1>🧮 SmartCalc Hindi</h1>
<p>आसान और मुफ्त Online Calculators</p>
</header>

<main>
<div class="grid">

<section class="card">
<h2>📊 Percentage Calculator</h2>
<input id="p1" type="number" placeholder="कुल संख्या">
<input id="p2" type="number" placeholder="प्राप्त संख्या">
<button onclick="percentage()">Calculate</button>
<div class="result" id="pr">Result यहाँ दिखेगा</div>
</section>

<section class="card">
<h2>🎂 Age Calculator</h2>
<input id="dob" type="date">
<button onclick="ageCalc()">Calculate Age</button>
<div class="result" id="ar">Result यहाँ दिखेगा</div>
</section>

<section class="card">
<h2>💰 EMI Calculator</h2>
<input id="loan" type="number" placeholder="Loan Amount (₹)">
<input id="rate" type="number" step="0.01" placeholder="Annual Interest (%)">
<input id="months" type="number" placeholder="Months">
<button onclick="emi()">Calculate EMI</button>
<div class="result" id="er">Result यहाँ दिखेगा</div>
</section>

<section class="card">
<h2>➕ Basic Calculator</h2>
<input id="n1" type="number" placeholder="पहली संख्या">
<input id="n2" type="number" placeholder="दूसरी संख्या">
<button onclick="basic('+')">जोड़ें +</button>
<br><br>
<button onclick="basic('-')">घटाएँ −</button>
<div class="result" id="br">Result यहाँ दिखेगा</div>
</section>

</div>
</main>

<footer>
© 2026 SmartCalc Hindi · Free Online Tools
</footer>

<script>
function percentage(){
 const total=Number(document.getElementById('p1').value);
 const got=Number(document.getElementById('p2').value);
 document.getElementById('pr').textContent =
 total>0 ? `Percentage: ${(got/total*100).toFixed(2)}%` : 'कृपया सही संख्या डालें।';
}
function ageCalc(){
 const d=new Date(document.getElementById('dob').value);
 if(isNaN(d)){document.getElementById('ar').textContent='कृपया जन्म तारीख चुनें।';return;}
 const now=new Date();
 let age=now.getFullYear()-d.getFullYear();
 const m=now.getMonth()-d.getMonth();
 if(m<0 || (m===0 && now.getDate()<d.getDate())) age--;
 document.getElementById('ar').textContent=`आपकी उम्र लगभग ${age} साल है।`;
}
function emi(){
 const P=Number(document.getElementById('loan').value);
 const annual=Number(document.getElementById('rate').value);
 const N=Number(document.getElementById('months').value);
 if(P<=0||N<=0){document.getElementById('er').textContent='कृपया सही जानकारी डालें।';return;}
 const r=annual/12/100;
 const payment=r===0?P/N:P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1);
 document.getElementById('er').textContent=`Monthly EMI: ₹${payment.toFixed(2)}`;
}
function basic(op){
 const a=Number(document.getElementById('n1').value);
 const b=Number(document.getElementById('n2').value);
 document.getElementById('br').textContent=`Result: ${op==='+'?a+b:a-b}`;
}
</script>
</body>
</html>
